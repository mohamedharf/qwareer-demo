  <!-- Tailwind Brand Theme Configuration -->

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plum: {
              DEFAULT: '#6E2468',
              dark: '#51164C',
              light: '#893382',
            },
            magenta: {
              DEFAULT: '#D22F7C',
              dark: '#B02064',
              light: '#EA569C',
            },
            lavender: {
              DEFAULT: '#A672B1',
              soft: '#F4EBF7',
              border: '#E5D3EC',
            },
            canvas: '#FAF7FB',
            ink: '#1F1624',
          },
          boxShadow: {
            'card': '0 4px 20px -4px rgba(110, 36, 104, 0.08)',
            'glow': '0 10px 25px -6px rgba(210, 47, 124, 0.38)',
            'flyout': '0 16px 40px -10px rgba(31, 22, 36, 0.18)',
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Dynamic Font Switching by Language */
    html[lang="ar"] body {
      font-family: 'Cairo', sans-serif;
    }
    html[lang="en"] body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
    }

    body {
      background-color: #FAF7FB;
      color: #1F1624;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animations */
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideToast {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-toast {
      animation: slideToast 0.26s ease-out forwards;
    }

    /* ========================================================================= */
    /* NESTED CATEGORIES DROPDOWN + SIDE FLYOUT MENU (RTL & LTR AWARE)           */
    /* ========================================================================= */
    .cat-dropdown-panel {
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }
    .cat-dropdown-wrap.is-open > .cat-dropdown-panel,
    .cat-dropdown-wrap:hover > .cat-dropdown-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    [dir="rtl"] .cat-dropdown-panel {
      right: 0;
      left: auto;
    }
    [dir="ltr"] .cat-dropdown-panel {
      left: 0;
      right: auto;
    }

    .sub-flyout-panel {
      opacity: 0;
      visibility: hidden;
      top: -6px;
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
    }
    /* In RTL, side flyout opens to the LEFT of the main category dropdown */
    [dir="rtl"] .sub-flyout-panel {
      right: 100%;
      left: auto;
      padding-right: 8px;
      transform: translateX(8px);
    }
    /* In LTR, side flyout opens to the RIGHT of the main category dropdown */
    [dir="ltr"] .sub-flyout-panel {
      left: 100%;
      right: auto;
      padding-left: 8px;
      transform: translateX(-8px);
    }

    .main-cat-item:hover > .sub-flyout-panel,
    .main-cat-item.flyout-open > .sub-flyout-panel {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    /* Cart Drawer directional positioning */
    [dir="rtl"] #cartPanel {
      left: 0;
      right: auto;
    }
    [dir="ltr"] #cartPanel {
      right: 0;
      left: auto;
    }
    [dir="rtl"] #cartPanel.cart-closed {
      transform: translateX(-100%);
    }
    [dir="ltr"] #cartPanel.cart-closed {
      transform: translateX(100%);
    }

    /* Mobile Nav Drawer directional positioning */
    [dir="rtl"] #mobileNavPanel {
      right: 0;
      left: auto;
    }
    [dir="ltr"] #mobileNavPanel {
      left: 0;
      right: auto;
    }
    [dir="rtl"] #mobileNavPanel.drawer-closed {
      transform: translateX(100%);
    }
    [dir="ltr"] #mobileNavPanel.drawer-closed {
      transform: translateX(-100%);
    }

    /* Admin Sidebar directional positioning */
    [dir="rtl"] #adminSidebar {
      right: 0;
      left: auto;
    }
    [dir="ltr"] #adminSidebar {
      left: 0;
      right: auto;
    }
    @media (max-width: 1023px) {
      [dir="rtl"] #adminSidebar.sidebar-closed {
        transform: translateX(100%);
      }
      [dir="ltr"] #adminSidebar.sidebar-closed {
        transform: translateX(-100%);
      }
    }
  </style>
</head>

                </div>
              </div>
            </div>

            <button

              class="px-4 py-2.5 rounded-xl text-sm font-extrabold transition-all"

    /**
     * =========================================================================
     * 3. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
     * =========================================================================
     */
    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.categories) && Array.isArray(parsed.products)) {
            return parsed;
          }
        }
      } catch (e) {}
      return {
        lang: 'ar',
        categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
        products: JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),
        orders: JSON.parse(JSON.stringify(DEFAULT_ORDERS)),
        cart: [],
        lastOrderNumber: 1043
      };
    }

    const saved = loadPersistedState();

    const appState = {
      lang: saved.lang || 'ar',
      page: 'home',              // 'home' | 'store' | 'admin'
      adminTab: 'dashboard',     // 'dashboard' | 'orders' | 'products' | 'categories'
      adminOrderFilter: 'all',

      // Store filters
      activeMainCat: 'all',
      activeSubCat: 'all',
      searchQuery: '',
      sortBy: 'featured',
      selectedVariants: {},      // { productId: variantIndex }

      // Cart & Checkout Drawer
      cart: Array.isArray(saved.cart) ? saved.cart : [],
      cartStep: 'cart',          // 'cart' | 'checkout' | 'success'
      deliveryMethod: 'delivery',
      deliveryAreaId: 'local',
      lastOrder: null,

      // Mobile accordion state
      mobileOpenCatId: null,

      // Persisted core collections
      categories: saved.categories,
      products: saved.products,
      orders: saved.orders,
      lastOrderNumber: saved.lastOrderNumber || 1043
    };

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: appState.lang,
          categories: appState.categories,
          products: appState.products,
          orders: appState.orders,
          cart: appState.cart,
          lastOrderNumber: appState.lastOrderNumber
        }));
      } catch (e) {}
    }

    function resetDemoData() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      appState.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      appState.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
      appState.orders = JSON.parse(JSON.stringify(DEFAULT_ORDERS));
      appState.cart = [];
      appState.lastOrderNumber = 1043;
      appState.activeMainCat = 'all';
      appState.activeSubCat = 'all';
      persistState();
      renderApp();
      showToast(t('resetDoneToast'));
    }

    function getCategory(catId) {
      return appState.categories.find(c => c.id === catId);
    }

    function getSubCategory(catId, subId) {
      const cat = getCategory(catId);
      if (!cat) return null;
      return cat.subCategories.find(s => s.id === subId) || null;
    }

    /**
     * =========================================================================
     * 5. LANGUAGE & SPA NAVIGATION CONTROLLERS
     * =========================================================================
     */
    function applyLanguageDirection() {
      const isAr = appState.lang === 'ar';
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.title = isAr
        ? 'قوارير | Qwareer — متجر الميكب والبرفانات والعناية بالبشرة'
        : 'Qwareer | قوارير — Makeup, Perfumes & Skincare Store';
    }

    function toggleLanguage() {
      appState.lang = appState.lang === 'ar' ? 'en' : 'ar';
      persistState();
      applyLanguageDirection();
      renderApp();
    }

    function navigateTo(page, mainCat = null, subCat = null, adminTab = null) {
      appState.page = page;
      if (mainCat !== null) appState.activeMainCat = mainCat;
      if (subCat !== null) appState.activeSubCat = subCat;
      if (adminTab !== null) appState.adminTab = adminTab;

      closeCategoriesDropdown();
      toggleMobileNav(false);
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleCategoriesDropdown() {
      const wrap = document.getElementById('categoriesDropdownWrap');
      wrap.classList.toggle('is-open');
    }

    function closeCategoriesDropdown() {
      const wrap = document.getElementById('categoriesDropdownWrap');
      if (wrap) wrap.classList.remove('is-open');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', e => {
      const wrap = document.getElementById('categoriesDropdownWrap');
      if (wrap && !wrap.contains(e.target)) {
        wrap.classList.remove('is-open');
      }
    });

    function toggleMobileNav(open) {
      const overlay = document.getElementById('mobileNavOverlay');
      const panel = document.getElementById('mobileNavPanel');
      if (open) {
        renderMobileNavDrawer();
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => panel.classList.remove('drawer-closed'));
      } else {
        panel.classList.add('drawer-closed');
        setTimeout(() => overlay.classList.add('hidden'), 260);
      }
    }

    function toggleMobileAccordion(catId) {
      appState.mobileOpenCatId = appState.mobileOpenCatId === catId ? null : catId;
      renderMobileNavDrawer();
    }

      // Filter & sort products
      const q = appState.searchQuery.trim().toLowerCase();
      let filtered = appState.products.filter(p => {
        const matchMain = appState.activeMainCat === 'all' || p.categoryId === appState.activeMainCat;
        const matchSub = appState.activeSubCat === 'all' || p.subCategoryId === appState.activeSubCat;
        const matchSearch = !q ||
          (p.name.ar || '').toLowerCase().includes(q) ||
          (p.name.en || '').toLowerCase().includes(q) ||
          (p.description.ar || '').toLowerCase().includes(q) ||
          (p.description.en || '').toLowerCase().includes(q);
        return matchMain && matchSub && matchSearch;
      });

      if (appState.sortBy === 'price-asc') {
        filtered.sort((a, b) => a.variants[0].price - b.variants[0].price);
      } else if (appState.sortBy === 'price-desc') {
        filtered.sort((a, b) => b.variants[0].price - a.variants[0].price);

    function setStoreFilter(mainId, subId) {
      appState.activeMainCat = mainId;
      appState.activeSubCat = subId;
      renderStorePage();
    }

    function handleStoreSearch(val) {
      appState.searchQuery = val;
      renderStorePage();
      const inp = document.getElementById('storeSearchInput');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    function handleStoreSort(val) {
      appState.sortBy = val;
      renderStorePage();
    }

    function clearStoreFilters() {
      appState.activeMainCat = 'all';
      appState.activeSubCat = 'all';
      appState.searchQuery = '';

     */
    function addToCart(productId) {
      const product = appState.products.find(p => p.id === productId);
      if (!product) return;
      const variantIndex = appState.selectedVariants[productId] || 0;
      const existing = appState.cart.find(item => item.productId === productId && item.variantIndex === variantIndex);
      if (existing) {
        existing.qty += 1;
      } else {
        appState.cart.push({ productId, variantIndex, qty: 1 });
      }
      persistState();
      renderHeaderAndChrome();
      showToast(`${t('addedToCartToast')}: ${loc(product.name)}`);
    }

    function updateCartQty(idx, delta) {
      if (!appState.cart[idx]) return;
      appState.cart[idx].qty += delta;
      if (appState.cart[idx].qty <= 0) appState.cart.splice(idx, 1);
      persistState();
      renderHeaderAndChrome();
      renderCartDrawer();
    }

    function removeCartItem(idx) {
      appState.cart.splice(idx, 1);
      persistState();
      renderHeaderAndChrome();
      renderCartDrawer();
    }

    function getCartSummary() {
      let subtotal = 0;
      let totalItems = 0;
      appState.cart.forEach(item => {
        const p = appState.products.find(x => x.id === item.productId);
        if (p && p.variants[item.variantIndex]) {
          subtotal += p.variants[item.variantIndex].price * item.qty;
          totalItems += item.qty;
        }
      });

      const areaObj = DELIVERY_AREAS.find(a => a.id === appState.deliveryAreaId) || DELIVERY_AREAS[0];
      const qualifiesFreeShipping = subtotal >= 1000;
      let deliveryFee = 0;
      if (appState.cart.length > 0 && appState.deliveryMethod === 'delivery') {
        deliveryFee = qualifiesFreeShipping ? 0 : areaObj.fee;
      }

      return {
        subtotal,
        totalItems,
        deliveryFee,
        total: subtotal + deliveryFee,
        qualifiesFreeShipping,
        areaObj
      };
    }

    function toggleCartDrawer(open) {
      const overlay = document.getElementById('cartOverlay');
      const panel = document.getElementById('cartPanel');
      if (open) {
        if (appState.cartStep === 'success') appState.cartStep = 'cart';
        renderCartDrawer();
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => panel.classList.remove('cart-closed'));
      } else {
        panel.classList.add('cart-closed');
        setTimeout(() => overlay.classList.add('hidden'), 260);
      }
    }

      appState.deliveryMethod = method;

    function submitDrawerOrder(e) {
      e.preventDefault();
      const name = document.getElementById('chkName').value.trim();
      const phone = document.getElementById('chkPhone').value.trim();
      const address = document.getElementById('chkAddress').value.trim();
      const errBox = document.getElementById('checkoutErrBox');

      if (name.length < 3) {
        errBox.textContent = t('errName');
        errBox.classList.remove('hidden');
        return;
      }
      if (phone.length < 10) {
        errBox.textContent = t('errPhone');
        errBox.classList.remove('hidden');
        return;
      }
      if (appState.deliveryMethod === 'delivery' && address.length < 5) {
        errBox.textContent = t('errAddress');
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      appState.lastOrderNumber += 1;
      const orderId = `#QWR-${appState.lastOrderNumber}`;
      const { total, areaObj } = getCartSummary();

      const itemsSummary = appState.cart.map(item => {
        const p = appState.products.find(x => x.id === item.productId);
        const v = p.variants[item.variantIndex] || p.variants[0];
        return `${loc(p.name)} (${loc(v.label)}) ×${item.qty}`;
      }).join('، ');

      const newOrder = {
        id: orderId,
        customerName: name,
        phone,
        deliveryMethod: appState.deliveryMethod,
        deliveryArea: appState.deliveryMethod === 'pickup'
          ? { ar: 'استلام مجاني من الفرع', en: 'Free Store Pickup' }
          : areaObj.name,
        address: address || (appState.lang === 'ar' ? 'استلام مباشر من الفرع' : 'Direct branch pickup'),
        itemsSummary,
        total,
        status: 'new',
        createdAt: new Date().toLocaleString(appState.lang === 'ar' ? 'ar-EG' : 'en-US', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        })
      };

      appState.orders.unshift(newOrder);
      appState.lastOrder = newOrder;
      appState.cart = [];
      appState.cartStep = 'success';
      persistState();
      renderHeaderAndChrome();
      renderCartDrawer();
    }

    function copyOrderId(orderId) {
      try {
        const inp = document.createElement('input');
        inp.value = orderId;
        document.body.appendChild(inp);
        inp.select();
        document.execCommand('copy');
        document.body.removeChild(inp);
        showToast(`${t('copiedToast')}: ${orderId}`);
      } catch (e) {}
    }

    function populateAdminSubCatSelect() {
      const mSel = document.getElementById('admProdMainCat');
      const sSel = document.getElementById('admProdSubCat');
      if (!mSel || !sSel) return;
      const cat = getCategory(mSel.value);
      if (!cat) return;
      sSel.innerHTML = cat.subCategories.map(s => `<option value="${s.id}">${loc(s.name)}</option>`).join('');
    }

    function handleAdminAddProduct(e) {
      e.preventDefault();
      const nameAr = document.getElementById('admProdAr').value.trim();
      const nameEn = document.getElementById('admProdEn').value.trim();
      const categoryId = document.getElementById('admProdMainCat').value;
      const subCategoryId = document.getElementById('admProdSubCat').value;
      const price = parseInt(document.getElementById('admProdPrice').value, 10) || 250;
      const variantType = document.getElementById('admProdVarType').value;
      const rawVars = document.getElementById('admProdVarVals').value.trim();

      if (!nameAr || !nameEn || !categoryId || !subCategoryId) return;

      const palette = ['#B85A7C', '#D22F7C', '#6E2468', '#DFB18E', '#C01E3A'];
      const parsedVars = rawVars
        ? rawVars.split(',').map(s => s.trim()).filter(Boolean)
        : (variantType === 'swatch' ? ['Rose', 'Nude'] : ['50 ml', '100 ml']);

      const variants = parsedVars.map((lbl, idx) => ({
        label: { ar: lbl, en: lbl },
        color: variantType === 'swatch' ? palette[idx % palette.length] : undefined,
        price: variantType === 'pill' && idx > 0 ? Math.round(price * (1 + idx * 0.4)) : price
      }));

      const svgMap = { makeup: 'lipstick', perfumes: 'perfume_floral', skincare: 'serum' };

      appState.products.unshift({
        id: 'p-' + Date.now(),
        name: { ar: nameAr, en: nameEn },
        description: {
          ar: 'منتج أصلي جديد من تشكيلة قوارير المختارة بعناية.',
          en: 'Brand new authentic arrival from the Qwareer curated collection.'
        },
        badge: { ar: 'جديد', en: 'New' },
        categoryId,
        subCategoryId,
        featured: true,
        salesCount: 60,
        svgType: svgMap[categoryId] || 'cream',
        variantType,
        variants
      });

      persistState();
      renderAdminPanel();
      showToast(t('productAddedToast'));
    }

    function deleteAdminProduct(productId) {
      appState.products = appState.products.filter(p => p.id !== productId);
      appState.cart = appState.cart.filter(item => item.productId !== productId);
      persistState();
      renderAdminPanel();
      showToast(t('productDeletedToast'));
    }

                <input type="text" id="admSubEn" required placeholder="e.g. Brushes & Tools" class="w-full rounded-xl border border-plum/20 bg-canvas px-3.5 py-2.5 text-sm outline-none focus:border-magenta" />
              </div>
              <button type="submit" class="py-2.5 px-4 rounded-xl bg-gradient-to-l from-plum to-magenta text-white font-extrabold text-sm shadow-glow hover:opacity-95 flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>${t('addSubCatBtn')}</span>
              </button>
            </form>
          </div>

          <!-- Visual Nested Tree -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            ${appState.categories.map(cat => {
              const totalCnt = appState.products.filter(p => p.categoryId === cat.id).length;
              return `
                <div class="bg-white rounded-3xl border border-plum/10 shadow-card overflow-hidden flex flex-col">
                  <div class="p-5 bg-gradient-to-l ${cat.gradient || 'from-plum to-magenta'} text-white flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
                        <i data-lucide="${cat.icon || 'folder'}" class="w-5 h-5"></i>
                      </div>
                      <div>
                        <h4 class="font-black text-base">${loc(cat.name)}</h4>
                        <p class="text-[11px] text-white/80">${cat.subCategories.length} ${t('subCategoriesCount')}</p>
                      </div>
                    </div>
                    <span class="px-2.5 py-1 rounded-xl bg-white/20 text-xs font-extrabold">${totalCnt} ${t('productsCountUnit')}</span>
                  </div>
                  <div class="p-4 flex-1 space-y-2.5">
                    ${cat.subCategories.map(sub => {
                      const subCnt = appState.products.filter(p => p.categoryId === cat.id && p.subCategoryId === sub.id).length;
                      return `
                        <div class="flex items-center justify-between p-3 rounded-2xl bg-canvas border border-plum/10">
                          <div>
                            <p class="font-bold text-sm text-ink">${loc(sub.name)}</p>
                            <p class="text-[11px] text-ink/50">${appState.lang === 'ar' ? sub.name.en : sub.name.ar}</p>
                          </div>
                          <span class="px-2.5 py-0.5 rounded-lg bg-white border border-plum/10 text-xs font-extrabold text-plum">${subCnt}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleAdminAddSubCat(e) {
      e.preventDefault();
      const parentId = document.getElementById('admSubParent').value;
      const ar = document.getElementById('admSubAr').value.trim();
      const en = document.getElementById('admSubEn').value.trim();
      if (!parentId || !ar || !en) return;

      const parent = getCategory(parentId);
      if (!parent) return;
      parent.subCategories.push({
        id: 'sub-' + Date.now(),
        name: { ar, en }
      });

      persistState();
      renderAdminPanel();
      showToast(t('subCatAddedToast'));
    }

    /**
     * =========================================================================
     * 12. MASTER RENDERER, TOASTS & BOOTSTRAP
     * =========================================================================
     */
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'animate-toast pointer-events-auto flex items-center gap-2.5 bg-ink text-white px-4 py-3 rounded-2xl shadow-xl border border-white/10 text-xs sm:text-sm font-bold max-w-xs sm:max-w-sm';
      toast.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-magenta shrink-0"></span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.22s ease';
        setTimeout(() => toast.remove(), 240);
      }, 2700);
    }

    function renderApp() {
      applyLanguageDirection();

      const storeShell = document.getElementById('storefrontShell');
      const homeEl = document.getElementById('homePageView');
      const storeEl = document.getElementById('storePageView');
      const adminEl = document.getElementById('adminPageView');

      if (appState.page === 'admin') {
        storeShell.classList.add('hidden');
        adminEl.classList.remove('hidden');
        renderAdminPanel();
      } else {
        adminEl.classList.add('hidden');
        storeShell.classList.remove('hidden');
        renderHeaderAndChrome();

        if (appState.page === 'home') {
          homeEl.classList.remove('hidden');
          storeEl.classList.add('hidden');
          renderHomePage();
        } else {
          homeEl.classList.add('hidden');
          storeEl.classList.remove('hidden');
          renderStorePage();
        }
      }

      // If cart drawer is currently open, re-render in new language
      const cartOverlay = document.getElementById('cartOverlay');
      if (cartOverlay && !cartOverlay.classList.contains('hidden')) {
        renderCartDrawer();
      }

      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('headerLogoSlot').innerHTML = getQwareerLogoSVG('qLogoHeader');
      renderApp();
    });
  </script>
</body>
</html>
